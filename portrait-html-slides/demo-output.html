<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告整理演示 · 模拟</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100dvh}main{width:min(100vw,56.25dvh);aspect-ratio:9/16;background:#050505;padding:8%;display:flex;flex-direction:column;justify-content:center}section{display:none}section.active{display:block}h1{font-size:clamp(24px,5vh,60px);line-height:1.25;overflow-wrap:anywhere}aside{font-size:16px;color:#ddd}nav{position:fixed;bottom:12px;background:#222;padding:8px}button{font:inherit;min-height:44px;margin:4px}button:focus-visible{outline:3px solid #48f}</style><main><section class="active"><h1>报告整理，3 步变 1 步。</h1><aside hidden>这是流程步骤数量，不代表时间下降比例。</aside></section><section><h1>上传 → 统一模板。</h1><aside hidden>解释导出、合并、排版三项如何整合。</aside></section><section><h1>先试一份报告。</h1><aside hidden>邀请实际试用，不补写成效数字。</aside></section></main><nav aria-label="演示导航"><button id="prev">上一页</button><output id="counter" aria-live="polite"></output><button id="next">下一页</button><button id="notes" aria-pressed="false">备注</button></nav><script>const slides=[...document.querySelectorAll('section')];let i=0,notes=false;const counter=document.querySelector('#counter');function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>{s.classList.toggle('active',k===i);s.querySelector('aside').hidden=!notes});counter.textContent=(i+1)+' / '+slides.length;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===slides.length-1}document.querySelector('#prev').onclick=()=>show(i-1);document.querySelector('#next').onclick=()=>show(i+1);document.querySelector('#notes').onclick=e=>{notes=!notes;e.currentTarget.setAttribute('aria-pressed',String(notes));show(i)};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(0);</script></html>
